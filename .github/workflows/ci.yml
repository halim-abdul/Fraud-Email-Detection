name: Test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[api,dev,train,reports]'
      - run: pytest -q
      - run: python -m compileall -q fraud_email api dashboard scripts
